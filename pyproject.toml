[project]
name = "securenotes-backend"
version = "0.1.0"
description = "FastAPI backend for the SecureNotes end-to-end-encrypted notes app"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1",
    "sqlalchemy>=2.0.52",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "greenlet>=3.5.1",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.14.0",
    "bcrypt>=5.0.0",
    "google-auth>=2.35.0",
    "requests>=2.32.0",
]
